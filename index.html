<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link Bio Gustavo Leal</title>

    <link rel="stylesheet" href="style.css">

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600&family=Rajdhani:wght@400;600&family=Share+Tech+Mono&display=swap" rel="stylesheet">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

    <!-- MATRIX -->
    <canvas id="matrix"></canvas>

    <!-- TERMINAL -->
    <div id="terminal">
        <p id="terminal-text"></p>
        <span class="cursor">_</span>
    </div>

    <!-- MAIN -->
    <div class="container" id="main-content">

        <header>
            <div class="profile-image">
                <img src="../imagens/photos/1.png">
            </div>

            <h1>Gustavo Leal</h1>
            <p class="subtitle">Full Stack Developer • Video Editor</p>
            <p class="follow-text">SYSTEM ONLINE</p>
        </header>

        <main class="links-list">

            <a href="https://www.instagram.com/theperfecttakes/" class="link-card" target="_blank">
                <div class="icon instagram"><i class="fab fa-instagram"></i></div>
                <div class="text">
                    <span class="title">Instagram</span>
                    <span class="description">Follow me</span>
                </div>
                <div class="arrow">↗</div>
            </a>

            <a href="https://github.com/GusttavoLeal" class="link-card" target="_blank">
                <div class="icon github"><i class="fab fa-github"></i></div>
                <div class="text">
                    <span class="title">GitHub</span>
                    <span class="description">Projects</span>
                </div>
                <div class="arrow">↗</div>
            </a>

            <a href="https://wa.me/5531999460225" class="link-card" target="_blank">
                <div class="icon whatsapp"><i class="fab fa-whatsapp"></i></div>
                <div class="text">
                    <span class="title">WhatsApp</span>
                    <span class="description">Contact</span>
                </div>
                <div class="arrow">↗</div>
            </a>

            <a href="https://discord.com/users/1204551778981519401" target="_blank" class="link-card">
                <div class="icon discord"><i class="fab fa-discord"></i></div>
                <div class="text">
                    <span class="title">Discord</span>
                    <span class="description">Direct</span>
                </div>
                <div class="arrow">↗</div>
            </a>

            <a href="https://x." target="_blank" class="link-card">
                <div class="icon x-twitter"><i class="fab fa-x-twitter"></i></div>
                <div class="text">
                    <span class="title">X</span>
                    <span class="description">Twitter Updates</span>
                </div>
                <div class="arrow">↗</div>
            </a>

        </main>

        <footer>
            <p>status: connected</p>
        </footer>

    </div>

    <script src="script.js"></script>
    <script src="matrix.js"></script>

</body>
</html>
